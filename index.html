<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我们的故事</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #fdf6f0 0%, #fce8e8 100%);
    color: #4a4a4a;
    line-height: 1.8;
    overflow-x: hidden;
  }

  /* ========== 樱花花瓣层 ========== */
  #sakura {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }
  .petal {
    position: absolute;
    top: -30px;
    background: radial-gradient(circle at 30% 30%, #ffd1dc, #ffb7c5);
    border-radius: 50% 0 50% 50%;
    opacity: 0.8;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0% {
      transform: translateY(-30px) rotate(0deg) translateX(0);
      opacity: 0;
    }
    10% { opacity: 0.9; }
    90% { opacity: 0.9; }
    100% {
      transform: translateY(105vh) rotate(720deg) translateX(80px);
      opacity: 0;
    }
  }

  /* ========== 顶部标题 ========== */
  header {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 100px 20px 40px;
  }
  header h1 {
    font-size: 2.4rem;
    color: #d98c8c;
    letter-spacing: 4px;
    margin-bottom: 16px;
  }
  header p {
    color: #999;
    font-size: 1rem;
  }

  /* ========== 计数器 ========== */
  .counter {
    position: relative;
    z-index: 2;
    text-align: center;
    margin: 20px auto 60px;
    padding: 30px 20px;
    max-width: 600px;
  }
  .counter .label {
    font-size: 0.9rem;
    color: #b08a8a;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }
  .counter .number {
    font-size: 4rem;
    font-weight: bold;
    color: #d98c8c;
    line-height: 1;
    text-shadow: 0 4px 20px rgba(217, 140, 140, 0.25);
  }
  .counter .unit {
    font-size: 1.2rem;
    color: #b08a8a;
    margin-left: 8px;
  }
  .counter .detail {
    margin-top: 18px;
    font-size: 1.05rem;
    color: #a87c7c;
    letter-spacing: 1px;
    font-weight: 500;
  }
  .counter .since {
    margin-top: 14px;
    font-size: 0.85rem;
    color: #bbb;
  }

  /* ========== 时间线 ========== */
  .timeline {
    position: relative;
    z-index: 2;
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px 120px;
  }
  .timeline::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 2px;
    background: #e8c4c4;
    transform: translateX(-50%);
  }
  .event {
    position: relative;
    width: 50%;
    padding: 20px 40px;
    opacity: 0;
    transform: translateY(40px);
    transition: all 0.8s ease;
  }
  .event.show {
    opacity: 1;
    transform: translateY(0);
  }
  .event.left { left: 0; text-align: right; }
  .event.right { left: 50%; text-align: left; }
  .event::after {
    content: "";
    position: absolute;
    top: 30px;
    width: 14px;
    height: 14px;
    background: #d98c8c;
    border: 3px solid #fdf6f0;
    border-radius: 50%;
    box-shadow: 0 0 0 2px #e8c4c4;
  }
  .event.left::after { right: -8px; }
  .event.right::after { left: -8px; }

  .event .date {
    font-size: 0.9rem;
    color: #d98c8c;
    font-weight: bold;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .event .card {
    background: #fff;
    padding: 20px 24px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(217, 140, 140, 0.12);
    display: inline-block;
    text-align: left;
    max-width: 100%;
  }
  .event .card h3 {
    font-size: 1.1rem;
    color: #333;
    margin-bottom: 8px;
  }
  .event .card p {
    font-size: 0.95rem;
    color: #777;
  }
  .event .card img {
    width: 100%;
    border-radius: 8px;
    margin-top: 12px;
    display: block;
  }

  .ending {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 80px 20px 120px;
    color: #d98c8c;
    font-size: 1.2rem;
    letter-spacing: 2px;
  }

  @media (max-width: 700px) {
    .timeline::before { left: 20px; }
    .event {
      width: 100%;
      left: 0 !important;
      text-align: left;
      padding-left: 60px;
      padding-right: 10px;
    }
    .event::after {
      left: 13px !important;
      right: auto !important;
    }
    .counter .number { font-size: 3rem; }
    .counter .detail { font-size: 0.9rem; }
  }
</style>
</head>
<body>

<!-- 樱花花瓣容器 -->
<div id="sakura"></div>

<header>
  <h1>我们的故事</h1>
  <p>从遇见你开始，每一刻都值得记住</p>
</header>

<!-- 计数器 -->
<div class="counter">
  <div class="label">我们已经在一起</div>

  <div>
    <span class="number" id="days">0</span>
    <span class="unit">天</span>
  </div>

  <div class="detail" id="detail">
    0 年 0 月 0 天 0 小时 0 分 0 秒
  </div>

  <div class="since">从 2023 年 1 月 5 日 至今</div>
</div>

<!-- 时间线 -->
<div class="timeline">

  <div class="event left">
    <div class="date">2023 年 1 月 5 日</div>
    <div class="card">
      <h3>故事开始</h3>
      <p>那一天，我们决定在一起。</p>
    </div>
  </div>

  <div class="event right">
    <div class="date">2023 年 5 月</div>
    <div class="card">
      <h3>第一次约会</h3>
      <p>我们去了那家小电影院，看了一部谁都没认真看的电影。</p>
    </div>
  </div>

  <div class="event left">
    <div class="date">2024 年 1 月</div>
    <div class="card">
      <h3>一起旅行</h3>
      <p>第一次一起出远门，在海边看了日落。</p>
      <!-- 把 photo1.jpg 换成你上传的图片文件名 -->
      <img src="photo1.jpg" alt="海边日落">
    </div>
  </div>

  <div class="event right">
    <div class="date">2024 年 6 月</div>
    <div class="card">
      <h3>一起搬家</h3>
      <p>有了属于我们两个人的小窝。</p>
    </div>
  </div>

  <div class="event left">
    <div class="date">现在</div>
    <div class="card">
      <h3>还在继续</h3>
      <p>故事还很长，慢慢写下去。</p>
    </div>
  </div>

</div>

<div class="ending">❤ 未完待续 ❤</div>

<script>
  /* ========== 1. 天数 + 年月日时分秒 ========== */
  // 改这里：把日期改成你们在一起的日期
  const startDate = new Date("2023-01-05T00:00:00");

  function updateCounter() {
    const now = new Date();

    // ---- 总天数 ----
    const diffMs = now - startDate;
    const totalDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
    document.getElementById("days").textContent = totalDays.toLocaleString();

    // ---- 年月日时分秒 ----
    let years = now.getFullYear() - startDate.getFullYear();
    let months = now.getMonth() - startDate.getMonth();
    let days = now.getDate() - startDate.getDate();
    let hours = now.getHours() - startDate.getHours();
    let minutes = now.getMinutes() - startDate.getMinutes();
    let seconds = now.getSeconds() - startDate.getSeconds();

    if (seconds < 0) { seconds += 60; minutes--; }
    if (minutes < 0) { minutes += 60; hours--; }
    if (hours < 0)   { hours += 24; days--; }
    if (days < 0) {
      const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
      days += prevMonth;
      months--;
    }
    if (months < 0) { months += 12; years--; }

    document.getElementById("detail").textContent =
      `${years} 年 ${months} 月 ${days} 天 ${hours} 小时 ${minutes} 分 ${seconds} 秒`;
  }

  updateCounter();
  setInterval(updateCounter, 1000);

  /* ========== 2. 樱花花瓣 ========== */
  const sakuraContainer = document.getElementById("sakura");
  const PETAL_COUNT = 25;

  function createPetal() {
    const petal = document.createElement("div");
    petal.className = "petal";

    const size = Math.random() * 12 + 8;
    petal.style.width = size + "px";
    petal.style.height = size + "px";

    petal.style.left = Math.random() * 100 + "vw";

    const duration = Math.random() * 8 + 8;
    petal.style.animationDuration = duration + "s";
    petal.style.animationDelay = Math.random() * 10 + "s";
    petal.style.opacity = Math.random() * 0.5 + 0.4;

    sakuraContainer.appendChild(petal);
  }

  for (let i = 0; i < PETAL_COUNT; i++) {
    createPetal();
  }

  /* ========== 3. 滚动淡入 ========== */
  const events = document.querySelectorAll(".event");
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add("show");
      }
    });
  }, { threshold: 0.15 });
  events.forEach(event => observer.observe(event));
</script>

</body>
</html>

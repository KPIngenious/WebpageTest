<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我们的故事</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 樱花花瓣容器 -->
<div id="sakura"></div>

<header>
  <h1>我们的故事</h1>
  <p>从遇见你开始，每一刻都值得记住</p>
</header>

<!-- 计数器 -->
<div class="counter">
  <div class="label">我们已经在一起</div>
  <div>
    <span class="number" id="days">0</span>
    <span class="unit">天</span>
  </div>
  <div class="detail" id="detail">
    0 年 0 月 0 天 0 小时 0 分 0 秒
  </div>
  <div class="since">从 2023 年 1 月 5 日 至今</div>
</div>

<!-- 时间线 -->
<div class="timeline">

  <div class="event left">
    <div class="date">2023 年 1 月 5 日</div>
    <div class="card">
      <h3>故事开始</h3>
      <p>那一天，我们决定在一起。</p>
    </div>
  </div>

  <div class="event right">
    <div class="date">2023 年 5 月</div>
    <div class="card">
      <h3>第一次约会</h3>
      <p>我们去了那家小电影院，看了一部谁都没认真看的电影。</p>
    </div>
  </div>

  <div class="event left">
    <div class="date">2024 年 1 月</div>
    <div class="card">
      <h3>一起旅行</h3>
      <p>第一次一起出远门，在海边看了日落。</p>
      <img src="images/photo1.jpg" alt="海边日落">
    </div>
  </div>

  <div class="event right">
    <div class="date">2024 年 6 月</div>
    <div class="card">
      <h3>一起搬家</h3>
      <p>有了属于我们两个人的小窝。</p>
    </div>
  </div>

  <div class="event left">
    <div class="date">现在</div>
    <div class="card">
      <h3>还在继续</h3>
      <p>故事还很长，慢慢写下去。</p>
    </div>
  </div>

</div>

<div class="ending">❤ 未完待续 ❤</div>

<script src="script.js"></script>
</body>
</html>
